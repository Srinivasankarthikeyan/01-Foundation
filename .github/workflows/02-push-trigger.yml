name: 02 Push Trigger

on:
  push:
    # Run when code is pushed to the main branch
    - main

    # Run when code is pushed to any branch inside releases/
    # Examples:
    # releases/v1
    # releases/v2
    # releases/production/v1
    branches:
      - main
      - 'releases/**'

      # Exclude branches matching dev/**
      # Examples:
      # dev/test
      # dev/feature-login
      - '!dev/**'

    # Run when tags matching v1.* are pushed
    # Examples:
    # v1.0
    # v1.1
    # v1.2.3
    tags:
      - 'v1.*'

    # Run only when files matching these patterns are changed
    paths:
      # Any file inside src/
      - 'src/**'

      # Run when this workflow file itself changes
      - '.github/workflows/02-push-trigger.yml'

      # Exclude all files inside docs/
      # Even if another path pattern matches
      - '!docs/**'

jobs:
  build:
    # Use the latest Ubuntu GitHub-hosted runner
    runs-on: ubuntu-latest

    steps:
      # Download repository code onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Execute a shell command
      - name: Display Success Message
        run: echo "Workflow triggered successfully"